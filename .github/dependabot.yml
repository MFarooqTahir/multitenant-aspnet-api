version: 2

# Keeps Central Package Management, the GitHub Actions pins and the Docker base
# image current. Grouped so a weekly run opens a handful of reviewable PRs
# instead of one per package.
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      test-stack:
        patterns:
          - "xunit*"
          - "coverlet*"
          - "Testcontainers*"
          - "Respawn"
      serilog:
        patterns:
          - "Serilog*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/src/Multitenant.Api"
    schedule:
      interval: "weekly"
