version: 2

# Keeps GitHub Actions pins and Docker images current. NuGet updates are manual
# because Dependabot does not reliably regenerate downstream packages.lock.json
# files for ProjectReference graphs; AGENTS.md documents the required regeneration.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Dependabot does not reliably regenerate downstream packages.lock.json files
  # for ProjectReference graphs. NuGet updates are therefore manual until that
  # support lands; AGENTS.md documents the required locked restore regeneration.
  - package-ecosystem: "docker"
    directory: "/src/Multitenant.Api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # PostgreSQL 17+ needs a dump/restore for existing named volumes; stay on 16 for now.
      - dependency-name: "postgres"
        versions: [">=17"]
