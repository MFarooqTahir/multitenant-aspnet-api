name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore multitenant-aspnet-api.slnx

      - name: Build
        run: dotnet build multitenant-aspnet-api.slnx -c Release --no-restore

      - name: Verify formatting
        run: dotnet format multitenant-aspnet-api.slnx --verify-no-changes --no-restore

      - name: Check for vulnerable packages
        run: dotnet list multitenant-aspnet-api.slnx package --vulnerable --include-transitive

      - name: Unit tests
        run: dotnet test tests/Multitenant.UnitTests/Multitenant.UnitTests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      # GitHub-hosted Ubuntu runners have Docker available, so Testcontainers
      # starts a real PostgreSQL instance here.
      - name: Integration tests
        run: dotnet test tests/Multitenant.IntegrationTests/Multitenant.IntegrationTests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=integration-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  publish-image:
    name: Publish container image
    needs: build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Multitenant.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
