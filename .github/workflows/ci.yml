name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          # .NET 11 GA. global.json pins the same 11.0.100 floor with
          # rollForward latestPatch, so patch SDKs still build the same code.
          dotnet-version: "11.0.100"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            Directory.Packages.props

      - name: Restore
        run: dotnet restore multitenant-aspnet-api.slnx --locked-mode

      - name: Build
        run: dotnet build multitenant-aspnet-api.slnx -c Release --no-restore

      - name: Verify formatting
        run: dotnet format multitenant-aspnet-api.slnx --verify-no-changes --no-restore

      - name: Check for vulnerable packages
        run: dotnet list multitenant-aspnet-api.slnx package --vulnerable --include-transitive

      - name: Unit tests
        run: dotnet test tests/Multitenant.UnitTests/Multitenant.UnitTests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults/unit

      # GitHub-hosted Ubuntu runners have Docker available, so Testcontainers
      # starts a real PostgreSQL instance here.
      - name: Integration tests
        run: dotnet test tests/Multitenant.IntegrationTests/Multitenant.IntegrationTests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=integration-tests.trx" --results-directory TestResults/integration

      - name: Install ReportGenerator
        if: always()
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path .tools --version 5.6.1

      - name: Generate coverage report
        if: always()
        run: |
          unit_report=$(find TestResults/unit -name coverage.cobertura.xml -print -quit)
          integration_report=$(find TestResults/integration -name coverage.cobertura.xml -print -quit)
          test -n "$unit_report"
          test -n "$integration_report"
          ./.tools/reportgenerator -reports:"$unit_report;$integration_report" -targetdir:TestResults/CoverageReport -reporttypes:"HtmlInline;Cobertura;MarkdownSummaryGithub"
          cat TestResults/CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: TestResults

      # The publish job only runs after a merge, so build the image here too:
      # a broken Dockerfile should fail the pull request, not master.
      - name: Build container image
        run: docker build --file src/Multitenant.Api/Dockerfile --tag multitenant-api:ci .

      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: multitenant-api:ci
          format: table
          scanners: vuln,secret,misconfig
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  security-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Ensure local development config is not tracked
        run: |
          if git ls-files --error-unmatch src/Multitenant.Api/appsettings.Development.json >/dev/null 2>&1; then
            echo "::error::appsettings.Development.json must never be committed"
            exit 1
          fi

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-image:
    name: Publish container image
    needs: [build-test, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: src/Multitenant.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
