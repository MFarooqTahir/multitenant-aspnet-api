[extend]
useDefault = true

# The real appsettings.Development.json is git-ignored and CI separately fails if
# it is ever tracked. Its historical committed copy used a key that has been
# rotated; allowlist only that old path. The tracked .example template is scanned
# normally. Purging history requires a coordinated rewrite outside this change.
[[allowlists]]
description = "Removed historical development config with rotated key"
paths = [
  '''src/Multitenant\.Api/appsettings\.Development\.json$'''
]
