services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: multitenant-DbUser
      POSTGRES_PASSWORD: multitenant-DbPassword123!
      POSTGRES_DB: multitenantDb
    ports: [ "5432:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jobforge" ]
      interval: 3s
      timeout: 3s
      retries: 10

  multitenant-aspnet-api:
    image: multitenant-aspnet-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=multitenantDb;Username=multitenant-DbUser;Password=multitenant-DbPassword123!"
    build:
      context: .
      dockerfile: multitenant-aspnet-api/Dockerfile