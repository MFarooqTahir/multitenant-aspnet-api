services:
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multitenant-DbUser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multitenant-DbPassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-multitenantDb}
    # Bound to loopback on purpose: `dotnet run` can still use it on
    # localhost:5432, but the database is not reachable from the LAN/Internet.
    # The data lives in the named volume below, so restarts and rebuilds reuse
    # the same database instead of creating a new one.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: multitenant-api:local
    build:
      context: .
      dockerfile: src/Multitenant.Api/Dockerfile
    ports:
      # The demo overlay seeds known accounts, so keep the API on loopback just
      # like PostgreSQL. Put a TLS-terminating proxy in front for shared access.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    volumes:
      - data-protection-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Production is the safer default: a 500 never echoes the exception even if
      # someone exposes the demo stack. Set Development for readable console logs.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: ${POSTGRES_CONNECTION_STRING:-Host=postgres;Port=5432;Database=${POSTGRES_DB:-multitenantDb};Username=${POSTGRES_USER:-multitenant-DbUser};Password=${POSTGRES_PASSWORD:-multitenant-DbPassword123!}}
      # Demo-only known key by default. Safe only because this compose file binds
      # the API to loopback; generate a real key before putting it behind a proxy.
      # openssl rand -base64 48
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}
      # Demo seeding is opt-in: without an explicit SEED_DEMO_DATA=true and a
      # DEMO_PASSWORD of your choosing, no accounts with known credentials exist.
      Demo__Password: ${DEMO_PASSWORD:-}
      Database__AutoMigrate: "true"
      Database__SeedDemoData: ${SEED_DEMO_DATA:-false}
      Auth__PublicBaseUrl: "http://localhost:${API_PORT:-8080}"

volumes:
  # Named volume: the database survives `down`, rebuilds and container restarts.
  # `docker compose down -v` is the only thing that deletes it.
  postgres-data:
  # Keeps Identity/Data Protection tokens valid across API container replacement.
  data-protection-keys:
