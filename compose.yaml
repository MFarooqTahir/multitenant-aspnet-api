services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: multitenant-DbUser
      POSTGRES_PASSWORD: multitenant-DbPassword123!
      POSTGRES_DB: multitenantDb
    ports: [ "5432:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U multitenant-DbUser -d multitenantDb" ]
      interval: 3s
      timeout: 3s
      retries: 10

  multitenant-api:
    image: multitenant-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=multitenantDb;Username=multitenant-DbUser;Password=multitenant-DbPassword123!"
      ASPNETCORE_ENVIRONMENT: Development
    build:
      context: .
      dockerfile: src/Multitenant.Api/Dockerfile